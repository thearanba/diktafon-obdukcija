name: Build APK

# Pravi debug APK koji se može sideload-ati na telefon (bez Play Store-a).
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:   # ručno pokretanje iz GitHub Actions taba

permissions:
  contents: write      # potrebno da workflow može objaviti Release sa .apk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python (Chaquopy buildPython)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      # Stabilan debug potpis: eksplicitan keystore na poznatoj putanji (app/build.gradle ga
      # koristi), keširan između buildova → SVI buildovi imaju isti potpis → APK se instalira
      # PREKO postojećeg, bez deinstalacije.
      - name: Cache debug keystore
        uses: actions/cache@v4
        with:
          path: keystore/debug.keystore
          key: diktafon-debug-keystore-v2

      - name: Generate debug keystore if missing
        run: |
          mkdir -p keystore
          if [ ! -f keystore/debug.keystore ]; then
            keytool -genkeypair -v -keystore keystore/debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Diktafon Obdukcija Debug, O=Forenzika, C=BA"
            echo "Generisan nov debug keystore."
          else
            echo "Keystore restauriran iz keša."
          fi

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      # Ime instalacionog fajla = ime aplikacije
      - name: Rename APK to app name
        run: cp app/build/outputs/apk/debug/app-debug.apk "Diktafon obdukcija.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: diktafon-obdukcija
          path: "Diktafon obdukcija.apk"
          if-no-files-found: error

      # Objavi APK kao Release "latest" → stalan direktan link (jedan tap na telefonu):
      # https://github.com/<user>/diktafon-obdukcija/releases/latest
      - name: Publish APK to 'latest' Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Najnoviji APK
          body: "Najnoviji build aplikacije. Tapni 'Diktafon obdukcija.apk' ispod za instalaciju na telefon."
          files: "Diktafon obdukcija.apk"
