name: Build APK

# Pravi debug APK koji se može sideload-ati na telefon (bez Play Store-a).
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:   # ručno pokretanje iz GitHub Actions taba

permissions:
  contents: write      # potrebno da workflow može objaviti Release sa .apk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python (Chaquopy buildPython)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      # Stabilan debug potpis između buildova → APK se može instalirati PREKO postojećeg
      # (bez deinstalacije). Prvi build napravi keystore, ostali ga ponovo koriste.
      - name: Cache debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: diktafon-obdukcija-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Objavi APK kao Release "latest" → stalan direktan link (jedan tap na telefonu):
      # https://github.com/<user>/diktafon-obdukcija/releases/latest
      - name: Publish APK to 'latest' Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Najnoviji APK
          body: "Najnoviji build aplikacije. Tapni app-debug.apk ispod za instalaciju na telefon."
          files: app/build/outputs/apk/debug/app-debug.apk
