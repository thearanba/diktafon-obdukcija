<!DOCTYPE html>
<html lang="bs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#373435">
<title>Diktafon obdukcija</title>
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-left">
    <img class="topbar-logo" src="/static/dfm-logo.svg" alt="dfm" aria-hidden="true">
    <span id="save-status-dot" title="Status auto-save"></span>
    <span id="draft-name-indicator" class="dim">(nema otvorenog nalaza)</span>
  </div>
  <div class="topbar-right">
    <button id="btn-menu" class="btn-menu" title="Meni" aria-label="Meni">⋮</button>
  </div>
  <div id="topbar-menu" class="topbar-menu">
    <div class="status" id="status-badge">učitavanje...</div>
    <div class="menu-sep"></div>
    <button id="btn-generate">📄 Generiši (.docx)</button>
    <button id="menu-share-gen">📤 Generiši i podijeli (OneDrive…)</button>
    <button id="menu-provjera">🔎 Provjeri zapisnik</button>
    <button id="btn-drafts">📂 Otvori draft</button>
    <button id="btn-new-draft">🆕 Novi draft</button>
    <button id="menu-export">💾 Izvezi drafte (ZIP)</button>
    <button id="menu-import">📥 Uvezi drafte (ZIP)</button>
    <button id="btn-clear" class="menu-danger">🗑 Reset</button>
    <div class="menu-sep"></div>
    <button id="menu-settings">⚙ Postavke (API ključevi)</button>
    <button id="menu-reload">↻ Osvježi</button>
  </div>
</header>

<main id="app">
  <div class="group-divider">Zaglavlje</div>
  <!-- Sekcija: Zaglavlje -->
  <section class="card collapsible" id="header-card">
    <div class="card-header-row">
      <button class="card-header" data-fs-card="header-card">
        <span class="section-idx"></span>
        <span class="card-title"><span class="ct-main">Zaglavlje predmeta</span></span>
        <span class="card-meta" id="header-summary"></span>
      </button>
      <button class="btn-focus" data-fs-close title="Zatvori" aria-label="Zatvori">✕</button>
    </div>
    <div class="card-body" id="header-body"></div>
  </section>

  <!-- Okolnosti slučaja / Uviđaj — kartica na home; klik OTVARA u fullscreen -->
  <section class="card collapsible" id="okolnosti-card">
    <div class="card-header-row">
      <button class="card-header" data-fs-card="okolnosti-card">
        <span class="section-idx"></span>
        <span class="card-title"><span class="ct-main" id="okolnosti-card-title">Okolnosti slučaja</span></span>
        <span class="card-meta" id="okolnosti-card-meta"></span>
      </button>
      <button class="btn-focus" data-fs-close title="Zatvori" aria-label="Zatvori">✕</button>
    </div>
    <div class="card-body" id="okolnosti-card-body"></div>
  </section>

  <!-- Izuzeti uzorci — kartica na home; klik OTVARA u fullscreen -->
  <section class="card collapsible" id="izuzeti-card">
    <div class="card-header-row">
      <button class="card-header" data-fs-card="izuzeti-card">
        <span class="section-idx"></span>
        <span class="card-title"><span class="ct-main">Izuzeti uzorci</span></span>
        <span class="card-meta" id="izuzeti-card-meta"></span>
      </button>
      <button class="btn-focus" data-fs-close title="Zatvori" aria-label="Zatvori">✕</button>
    </div>
    <div class="card-body" id="izuzeti-card-body"></div>
  </section>

  <!-- Sekcije diktiranja -->
  <div id="sections-container"></div>

  <div id="toast" class="toast hidden"></div>
</main>

<!-- Donja traka u fokus-modu: navigacija (gornji red) + akcije uz mikrofon (donji red) -->
<div id="focus-nav" class="focus-nav">
  <div id="rec-timer" class="rec-timer">● 0:00</div>
  <div class="focus-row focus-prevnext">
    <button id="focus-prev" class="focus-side">←</button>
    <button id="focus-next" class="focus-side">→</button>
  </div>
  <div class="focus-row focus-actions">
    <button id="focus-clear" class="focus-act danger">✕ Obriši</button>
    <button id="focus-mic" class="focus-mic">🎤</button>
    <button id="focus-merge" class="focus-act primary">🪄 Spoji</button>
  </div>
</div>

<!-- Donja traka za Okolnosti/Izuzeti u fullscreen (ista kao sekcijska) -->
<div id="card-fs-nav" class="focus-nav">
  <div id="rec-timer-card" class="rec-timer">● 0:00</div>
  <div class="focus-row focus-prevnext">
    <button id="cardfs-prev" class="focus-side">←</button>
    <button id="cardfs-next" class="focus-side">→</button>
  </div>
  <div class="focus-row focus-actions">
    <button id="cardfs-left" class="focus-act">📷 Slikaj</button>
    <button id="cardfs-mic" class="focus-mic">🎤</button>
    <button id="cardfs-act" class="focus-act primary">✨ Doradi</button>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
