<!DOCTYPE html>
<html lang="bs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1e293b">
<title>Diktafon obdukcija</title>
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-left">
    <span id="save-status-dot" title="Status auto-save"></span>
    <span id="draft-name-indicator" class="dim">(nema otvorenog nalaza)</span>
  </div>
  <div class="topbar-right">
    <span class="status" id="status-badge">učitavanje...</span>
    <button id="btn-menu" class="btn-menu" title="Meni" aria-label="Meni">⋮</button>
  </div>
  <div id="topbar-menu" class="topbar-menu">
    <button id="btn-generate">📄 Generiši (.docx)</button>
    <button id="btn-drafts">📂 Otvori draft</button>
    <button id="btn-new-draft">🆕 Novi draft</button>
    <button id="btn-clear" class="menu-danger">🗑 Reset</button>
    <div class="menu-sep"></div>
    <button id="menu-settings">⚙ Postavke (API ključevi)</button>
    <button id="menu-reload">↻ Osvježi</button>
  </div>
</header>

<main id="app">
  <!-- Sekcija: Zaglavlje -->
  <section class="card collapsible" id="header-card">
    <button class="card-header" data-toggle>
      <span class="caret">▸</span>
      <span class="card-title">Zaglavlje predmeta</span>
      <span class="card-meta" id="header-summary"></span>
    </button>
    <div class="card-body" id="header-body"></div>
  </section>

  <!-- Sekcije diktiranja -->
  <div id="sections-container"></div>

  <div id="toast" class="toast hidden"></div>
</main>

<!-- Donja traka u fokus-modu: navigacija (gornji red) + akcije uz mikrofon (donji red) -->
<div id="focus-nav" class="focus-nav">
  <div class="focus-row focus-prevnext">
    <button id="focus-prev" class="focus-side">←</button>
    <button id="focus-next" class="focus-side">→</button>
  </div>
  <div class="focus-row focus-actions">
    <button id="focus-clear" class="focus-act danger">✕ Obriši</button>
    <button id="focus-mic" class="focus-mic">🎤</button>
    <button id="focus-merge" class="focus-act primary">🪄 Spoji</button>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
