plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.chaquo.python'
}

android {
    namespace 'ba.forenzika.diktafon'
    compileSdk 34

    defaultConfig {
        // v2 (redizajn) = ZASEBNA aplikacija — instalira se PORED stare (drugi applicationId).
        // namespace ostaje isti (paket koda/R klase); samo instalacioni ID se razlikuje.
        applicationId 'ba.forenzika.diktafon.v2'
        minSdk 29          // Android 10 — pojednostavljuje MediaStore (Downloads bez dozvole)
        targetSdk 34
        versionCode 1
        versionName '2.0'

        ndk {
            // S25 Ultra je arm64-v8a; x86_64 je za emulator
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    signingConfigs {
        // ISTI ključ za debug i release — namjerno. Potpis mora ostati STABILAN da se nova
        // verzija instalira PREKO postojeće: drafti su jedini primjerak rada, a promjena
        // ključa bi tražila deinstalaciju (= gubitak svega neizvezenog).
        // „debug" je samo ime fajla; sigurnosnu razliku pravi BUILD TIP — release znači
        // debuggable=false, pa `adb run-as` više ne može čitati drafte i API ključeve.
        debug {
            storeFile file("$rootDir/keystore/debug.keystore")
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            storeFile file("$rootDir/keystore/debug.keystore")
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            // Debug APK se može sideload-ati bez Play Store-a; nije minifikovan
            minifyEnabled false
            // Koristi stabilan keystore SAMO ako postoji (CI ga generiše/kešira).
            // Lokalno bez njega → AGP default debug potpis (build ne puca).
            if (file("$rootDir/keystore/debug.keystore").exists()) {
                signingConfig signingConfigs.debug
            }
        }
        release {
            // Ovo je verzija koja ide na telefon (CI gradi assembleRelease).
            // debuggable je ovdje false po defaultu — to je cijeli razlog prelaska.
            // minifyEnabled OSTAJE false: R8 bi mogao pojesti klase koje Chaquopy dohvata
            // refleksijom, a ušteda na veličini nam ništa ne znači.
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (file("$rootDir/keystore/debug.keystore").exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

chaquopy {
    defaultConfig {
        version = '3.11'
        pip {
            // python-docx povlači lxml (Chaquopy ima prebuilt wheel) + typing_extensions.
            // certifi = CA bundle za HTTPS (Android nema Python-friendly sistemski CA store).
            // Sve ostalo (HTTP klijenti) je stdlib — bez native rizika.
            install 'python-docx'
            install 'certifi'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.webkit:webkit:1.11.0'
    // App lock: otisak prsta (BiometricPrompt) + šifrovano skladište ključeva/lozinke
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
}
